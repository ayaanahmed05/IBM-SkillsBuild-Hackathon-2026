services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:4000:4000"]
    environment:
      DATABASE_URL: sqlite:////data/momentguard.db
      FRONTEND_ORIGIN: http://localhost:5173
      API_TOKEN: ${API_TOKEN:-}
    volumes: ["simulation-data:/data"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    environment:
      API_PROXY_TARGET: http://backend:4000
    depends_on: [backend]
volumes:
  simulation-data:
