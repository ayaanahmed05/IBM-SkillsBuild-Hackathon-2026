services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:4000:4000"]
    environment:
      DATABASE_URL: sqlite:////data/momentguard.db
      FRONTEND_ORIGIN: http://localhost:8080
      API_TOKEN: ${API_TOKEN:-}
    volumes: ["simulation-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  simulation-data:
